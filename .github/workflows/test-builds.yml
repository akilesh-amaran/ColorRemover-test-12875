name: Test Builds

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-compile:
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-tools-dev libgl1-mesa-dev
        
    - name: Install Qt (Windows/macOS)
      if: runner.os != 'Linux'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'  # Use stable version
        host: ${{ runner.os == 'Windows' && 'windows' || 'mac' }}
        target: 'desktop'
        arch: ${{ runner.os == 'Windows' && 'win64_mingw' || '' }}
        cache: true
        
    - name: Test compilation (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "=== Linux Build ==="
        qmake6 ColorRemover_simple.pro CONFIG+=release
        make -j$(nproc)
        echo "=== Linux Build Complete ==="
        
    - name: Test compilation (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        echo === Windows Build ===
        qmake ColorRemover_simple.pro "CONFIG+=release"
        mingw32-make -j2
        echo === Windows Build Complete ===
        
    - name: Test compilation (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "=== macOS Build ==="
        qmake ColorRemover_simple.pro CONFIG+=release
        make -j$(sysctl -n hw.ncpu)
        echo "=== macOS Build Complete ==="
        
    - name: Verify executable
      run: |
        ls -la ColorRemover* || ls -la release/ColorRemover* || echo "Executable check complete"
