name: Test All Platforms

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'linux'
        target: 'desktop'
        cache: true
        
    - name: Test Build Ubuntu
      run: |
        echo "=== Ubuntu Build Test ==="
        qmake --version
        qmake ColorRemover_simple.pro CONFIG+=release
        make -j2
        echo "✅ Ubuntu build successful"

  test-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        
    - name: Test Build Windows
      shell: cmd
      run: |
        echo === Windows Build Test ===
        qmake --version
        echo === Running qmake ===
        qmake ColorRemover_simple.pro "CONFIG+=release"
        echo === Running mingw32-make ===
        mingw32-make -j2
        echo === Checking output ===
        if exist "release\ColorRemover.exe" (
          echo ✅ Windows build successful
          dir release\
        ) else (
          echo ❌ Windows build failed - no executable found
          exit /b 1
        )

  test-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'mac'
        target: 'desktop'
        cache: true
        
    - name: Test Build macOS
      run: |
        echo "=== macOS Build Test ==="
        qmake --version
        echo "=== Running qmake ==="
        qmake ColorRemover_simple.pro CONFIG+=release
        echo "=== Running make ==="
        make -j$(sysctl -n hw.ncpu)
        echo "=== Checking output ==="
        if [ -f "release/ColorRemover" ] || [ -d "ColorRemover.app" ]; then
          echo "✅ macOS build successful"
          ls -la release/ 2>/dev/null || ls -la *.app 2>/dev/null || echo "No output directory found"
        else
          echo "❌ macOS build failed - no executable found"
          exit 1
        fi
