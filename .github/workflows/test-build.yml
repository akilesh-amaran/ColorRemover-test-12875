name: Test Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-build-ubuntu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: List project files
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo "=== Source Files ==="
        find . -name "*.cpp" -o -name "*.h" -o -name "*.pro" | head -20
        echo "=== Qt Project File Content ==="
        if [ -f "ColorRemover.pro" ]; then
          cat ColorRemover.pro
        else
          echo "ColorRemover.pro not found"
        fi
        
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'linux'
        target: 'desktop'
        cache: true
        
    - name: Test qmake
      run: |
        echo "=== Testing qmake ==="
        qmake --version
        echo "=== Running qmake with simple project ==="
        qmake ColorRemover_simple.pro CONFIG+=release
        echo "=== Generated Makefile ==="
        if [ -f "Makefile" ]; then
          echo "Makefile created successfully"
          head -30 Makefile
        else
          echo "ERROR: Makefile not generated"
          echo "Trying original project file..."
          qmake ColorRemover.pro CONFIG+=release
          if [ -f "Makefile" ]; then
            echo "Original project file worked"
          else
            echo "Both project files failed"
            exit 1
          fi
        fi
        
    - name: Test compilation
      run: |
        echo "=== Attempting compilation ==="
        make -j2 2>&1 | tee build.log
        echo "=== Build status ==="
        if [ -f "release/ColorRemover" ]; then
          echo "✅ Build successful"
          ls -la release/
        else
          echo "❌ Build failed"
          echo "=== Build log ==="
          cat build.log
          exit 1
        fi
